<!-- AI 澆水確認彈窗 - 由 POST /plants/water 回傳後注入到 #water-modal-container -->
<dialog id="ai-watering-dialog" open class="ai-dialog-card">
    <!-- 頂部色條已移除以配合全版設計 -->

    <div class="ai-dialog-body">
        <!-- 簡化標題與建議 (方案三) -->
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <h3 class="ai-dialog-title" style="margin-bottom: 0.5rem; font-size: 1.5rem; font-weight: 600; color: var(--pico-h1-color);">
                {% if advice.recommend %}✅ AI 建議澆水{% else %}⚠️ AI 不建議澆水{% endif %}
            </h3>
            <p class="ai-dialog-subtitle" style="margin-bottom: 0; opacity: 0.75;">植物品種：{{ advice.species }}</p>
        </div>

        <!-- 關鍵原因 (方案一：隱藏其餘數據，僅凸顯原因) -->
        <div class="ai-chat-bubble {% if not advice.recommend %}ai-chat-bubble-warning{% endif %}" style="text-align: center; font-size: 1.15rem; padding: 1.25rem 1rem; margin-bottom: 2rem;">
            {{ advice.reason }}
        </div>

        <!-- 操作按鈕 -->
        <div class="ai-dialog-actions">
            <!-- 取消 -->
            <button
                class="outline secondary ai-dialog-btn-cancel mb-0"
                onclick="document.getElementById('ai-watering-dialog').remove(); const o=document.querySelector('[data-ai-overlay]'); if(o) o.remove();"
            >
                ❌ 取消
            </button>

            <!-- 確定灌溉
                 關鍵：
                 1. hx-on::before-request：按鈕進入「傳送中」狀態
                 2. hx-on::after-request：
                    - 先移除 dialog（此時 HTMX 已完成請求）
                    - 確認成功 (204) 才 dispatch start-watering-client
                    - 失敗 (409/503) 時 alert 並還原按鈕
            -->
            <button id="ai-confirm-btn"
                class="{% if advice.recommend %}btn-gradient-success{% else %}btn-gradient-warning{% endif %} ai-dialog-btn-confirm mb-0"
                hx-post="/plants/water/confirm"
                hx-vals='{"duration": {{ advice.water_seconds|default(0.5) }}}'
                hx-target="#water-modal-container"
                hx-swap="innerHTML"
                hx-on::before-request="this.innerHTML='⏳ 傳送中...'; this.style.opacity='0.7'; this.style.pointerEvents='none';"
                hx-on::after-request="
                    const d = document.getElementById('ai-watering-dialog'); if(d) d.remove();
                    const o = document.querySelector('[data-ai-overlay]'); if(o) o.remove();"
            >
                💦 確定灌溉
            </button>
        </div>

        <p class="ai-dialog-footer-text mb-0 text-center">
            最終決定由您做主，AI 僅供參考
        </p>
    </div>
</dialog>

<!-- 遮罩層 -->
<div
    data-ai-overlay class="modal-backdrop"
    onclick="document.getElementById('ai-watering-dialog').remove(); this.remove();"
></div>

<script>
    // 確保動態注入的 hx-* 屬性（包含 hx-on::）被 HTMX 正確識別
    htmx.process(document.getElementById('ai-watering-dialog'));
</script>
