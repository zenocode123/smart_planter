{% extends "base.html" %}

{% block content %}
<article style="max-width: 400px; margin: 0 auto; text-align: center;">
    <h2>註冊智慧盆栽系統</h2>

    <!-- hx-post 發送請求到 /register -->
    <form hx-post="/auth/register" hx-target="#auth-message" hx-swap="innerHTML">
        <label for="username">
            選擇帳號
            <input type="text" id="username" name="username" required placeholder="輸入新帳號"
                oninvalid="this.setCustomValidity('請輸入您的帳號')" oninput="this.setCustomValidity('')">
        </label>

        <label for="password">
            選擇密碼
            <input type="password" id="password" name="password" required placeholder="輸入新密碼"
                oninvalid="this.setCustomValidity('請輸入您的密碼')" oninput="this.setCustomValidity('')">
        </label>

        <div id="auth-message" style="margin-bottom: 1rem;"></div>

        <button type="submit">註冊</button>
    </form>

    <p>已經有帳號了嗎？<a href="/auth/login">返回登入</a></p>
</article>
{% endblock %}
