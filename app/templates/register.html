{% extends "base.html" %}

{% block content %}
<article style="max-width: 400px; margin: 2rem auto;">
    <h2 style="text-align: center;">註冊帳號</h2>

    <form hx-post="/auth/register" hx-target="#auth-message" hx-swap="innerHTML">
        <label for="username">
            顯示名稱 (Username)
            <input type="text" id="username" name="username" required placeholder="例如：綠手指小明">
        </label>

        <label for="email">
            Gmail 帳號
            <input type="email" id="email" name="email" required placeholder="yourname@gmail.com">
        </label>

        <label for="gmail_app_password">
            Gmail 應用程式密碼
            <input type="password" id="gmail_app_password" name="gmail_app_password" required placeholder="16 位數應用程式密碼">
            <small><a href="https://myaccount.google.com/apppasswords" target="_blank">如何取得？</a></small>
        </label>

        <label for="password">
            設定登入密碼 (System Password)
            <input type="password" id="password" name="password" required placeholder="輸入新密碼">
        </label>

        <div id="auth-message" style="margin-top: 1rem; margin-bottom: 1rem;"></div>

        <button type="submit">完成註冊</button>
    </form>

    <p style="text-align: center; margin-top: 1rem;">已經有帳號了嗎？<a href="/auth/login">返回登入</a></p>
</article>
{% endblock %}
