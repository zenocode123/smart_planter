{% extends "base.html" %}

{% block content %}
<section class="settings-card">
    <div class="page-title text-center mb-2">
        <h2 class="mb-0">🌱 植物檔案設定</h2>
        <p class="text-muted">設定基本的植物資訊，讓系統提供更好的建議</p>
    </div>

    <article>
        <!-- 照片上傳區域 -->
        <div class="photo-upload-area" style="display: flex; flex-direction: column; align-items: center; gap: 1.5rem; margin-bottom: 2rem;">
            <div class="photo-preview-box" id="photo-preview">
                {% if plant and plant.photo_path %}
                <img src="{{ plant.photo_path }}" alt="Plant Photo">
                {% else %}
                <span class="text-3xl">🌿</span>
                {% endif %}
            </div>
            
            <form hx-post="/plants/photo"
                  hx-target="#photo-preview"
                  hx-swap="innerHTML"
                  hx-encoding="multipart/form-data"
                  style="text-align: center; margin-bottom: 0;">
                <input type="file" name="photo" id="photo-input" accept=".jpg,.jpeg,.png,.webp"
                       class="d-none"
                       @change="$el.closest('form').requestSubmit()">
                <button type="button" id="upload-btn" class="outline secondary btn-auto-width"
                        @click="document.getElementById('photo-input').click()"
                        style="margin-bottom: 0;">
                    📷 上傳照片
                </button>
            </form>
        </div>

        <hr>

        <!-- 植物資料表單 -->
        <form hx-post="/plants/profile" hx-target="#form-message"
              hx-indicator="#save-loading" hx-disabled-elt="#save-btn" style="margin-bottom: 0;">
            <label for="nickname">
                植物暱稱 <small class="text-danger">*必填</small>
                <input type="text" id="nickname" name="nickname" value="{{ plant.nickname if plant else '' }}" required>
            </label>

            <label for="species">
                植物品種 <small class="text-danger">*必填</small>
                <input type="text" id="species" name="species" value="{{ plant.species if plant else '' }}" required>
            </label>

            <label for="planting_date">
                種植日期 <small>（選填）</small>
                <input type="date" id="planting_date" name="planting_date"
                       value="{{ plant.planting_date.isoformat() if plant and plant.planting_date else '' }}">
            </label>

            <div id="form-message" class="my-1"></div>

            <!-- Loading 指示器（HTMX 自動控制顯示/隱藏）-->
            <div id="save-loading" class="htmx-indicator text-center p-1">
                <progress indeterminate class="progress-sm"></progress>
                <p class="loading-text">
                    🧠 正在儲存並生成 AI 人格，請稍候...
                </p>
            </div>

            <div class="settings-actions" style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <a href="/" role="button" class="outline secondary" style="flex: 1; text-align: center; padding-top: calc(1rem - 2px);">取消</a>
                <button type="submit" id="save-btn" style="flex: 2; margin-bottom: 0;">💾 儲存設定</button>
            </div>
        </form>
    </article>
</section>
{% endblock %}
