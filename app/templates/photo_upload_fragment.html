<!-- Photo Upload Result Fragment (HTMX OOB) -->

<div id="photo-preview" class="photo-preview-box position-relative" hx-swap-oob="true">
    <img src="{{ photo_url }}" alt="植物照片" class="img-cover photo-anim-dim">
    
    <!-- 成功動畫的勾勾 -->
    <div class="photo-success-icon">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
    </div>
    
    <!-- 視覺回饋：延遲移除變暗效果 -->
    <script>
        setTimeout(() => {
            const previewObj = document.getElementById("photo-preview");
            if(previewObj) {
                const img = previewObj.querySelector("img");
                const icon = previewObj.querySelector("div.photo-success-icon");
                if(img) img.classList.remove("photo-anim-dim");
                if(icon) icon.remove();
            }
        }, 2000);
    </script>
</div>

<!-- 更新按鈕文字為「更換照片」 (OOB) -->
<button type="button" id="upload-btn" class="outline secondary btn-auto-width opacity-80" hx-swap-oob="true"
        onclick="document.getElementById('photo-input').click();">
    🔄 更換照片
</button>

<!-- Toast 訊息通知 (OOB) -->
<div id="photo-message" hx-swap-oob="true">
    <script>
        if (typeof showToast === 'function') {
            showToast("✅ 照片上傳成功", "success");
        }
    </script>
</div>
