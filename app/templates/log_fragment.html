{% if log %}
<div class="log-card" style="margin-top: 1.5rem;">
    <!-- AI 分析小語區塊 -->
    <article style="background: var(--pico-card-sectioning-background-color); border: 1px solid var(--pico-muted-border-color); margin-bottom: 2rem;">
        <header style="margin-bottom: 0.5rem; color: var(--pico-primary); font-weight: bold;">
            🪴 來自 AI 的最新分析 <span style="font-size: 0.8em; color: var(--pico-muted-color); font-weight: normal;">({{ log.created_at.strftime('%m-%d %H:%M') if log.created_at else '' }})</span>
        </header>
        <p style="margin-bottom: 0;">{{ log.ai_analysis if log.ai_analysis else "AI 正在沉思中，請稍後..." }}</p>
    </article>

    <!-- 歷史趨勢圖與照片並排顯示 (桌機並排，手機單欄) -->
    <div class="grid">
        <!-- 歷史趨勢折線圖 -->
        <div>
            <h4 style="margin-bottom: 0.5rem;">📊 環境趨勢圖</h4>
            <div style="border-radius: 8px; overflow: hidden; border: 1px solid var(--pico-muted-border-color); background: white;">
                <img src="/static/plots/history_chart.png" alt="History Chart" style="width: 100%; height: auto; display: block;" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiNlMGUwZTAiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGFsaWdubWVudC1iYXNlbGluZT0ibWlkZGxlIiBmaWxsPSIjNzc3Ij7lnJblgJnrkoDliIbkub0uLjwvdGV4dD48L3N2Zz4='">
            </div>
        </div>
        
        <!-- 自動排程拍攝的最新實體相片 -->
        <div>
            <h4 style="margin-bottom: 0.5rem;">📷 最新相片</h4>
            <div style="border-radius: 8px; overflow: hidden; border: 1px solid var(--pico-muted-border-color); aspect-ratio: 16/9; background: #000;">
                {% if log.photo_path %}
                <img src="{{ log.photo_path }}" alt="Latest Plant Photo" style="width: 100%; height: 100%; object-fit: cover; display: block;">
                {% else %}
                <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #777;">暫無照片</div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% else %}
<div style="text-align: center; color: var(--pico-muted-color); padding: 2rem; border: 1px dashed var(--pico-muted-border-color); border-radius: 8px; margin-top: 1.5rem;">
    ⏰ 等待第一次排程執行，目前尚未有歷史紀錄。
</div>
{% endif %}
