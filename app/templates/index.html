{% extends "base.html" %}

{% block content %}

{% if msg %}
<div x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 3000)" x-transition
     style="position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 3000;">
    <article style="padding: 0.75rem 1.5rem; border: 1px solid var(--pico-ins-color); background: var(--pico-card-background-color);">
        <span style="color: var(--pico-ins-color);">✅ {{ msg }}</span>
    </article>
</div>
{% endif %}

<section id="dashboard" class="fade-in">
    <div class="dashboard-layout">
        <!-- 植物卡片 -->
        <div class="plant-card">
            <div style="padding: 1rem;">
                <h3 style="margin-bottom: 0.5rem; text-align: center;">{{ plant.nickname if plant else '未命名植物' }}</h3>
                <p style="text-align: center; color: var(--pico-muted-color); margin-bottom: 1rem;">{{ plant.species if plant else '未知品種' }}</p>
                <div style="aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #f0f0f0;">
                    {% if plant and plant.photo_path %}
                    <img src="{{ plant.photo_path }}" alt="Plant" style="width: 100%; height: 100%; object-fit: cover;">
                    {% else %}
                    <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 5rem;">🌿</div>
                    {% endif %}
                </div>
            </div>
        </div>

        <!-- 數據與控制 -->
        <div class="sensor-cards-container">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h4 style="margin: 0;">感測數值</h4>
                <button @click="triggerRefresh()" class="outline secondary" style="border: none; padding: 0.25rem; width: auto; margin: 0;">
                    <svg :class="isRefreshing ? 'rotating' : ''" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
                </button>
            </div>

            <div id="sensor-container" 
                 hx-get="/plants/sensors" 
                 hx-trigger="load, every {{ interval }}s" 
                 hx-swap="innerHTML">
                <div aria-busy="true" style="text-align: center; padding: 2rem;">載入中...</div>
            </div>

            <!-- OOB 目標：連線狀態與更新時間 -->
            <div id="dashboard-controls"></div>

            <div style="margin-top: 1rem;">
                <button hx-post="/plants/water" 
                        hx-target="#sensor-container" 
                        @click="watering = true; setTimeout(() => watering = false, 5000)" 
                        class="contrast"
                        style="width: 100%; font-weight: bold; padding: 1rem;">
                    💦 澆水
                </button>
            </div>
        </div>
    </div>
</section>
{% endblock %}
