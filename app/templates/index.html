{% extends "base.html" %}

{% block content %}

{% if msg %}
<div x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 3000)" x-transition
    class="toast-notice-container">
    <article class="toast-notice-card solid-popup-bg">
        <span class="toast-notice-text">✅ {{ msg }}</span>
    </article>
</div>
{% endif %}

<section id="dashboard" class="fade-in">
    <div class="dashboard-layout">
        <!-- 植物卡片 -->
        <div class="plant-card">
            <div class="card-padding">
                <h3 class="text-center" style="margin-bottom: 0.5rem;">{{ plant.nickname if plant else '未命名植物' }}</h3>
                <p class="text-center text-muted mb-1">{{ plant.species if plant else '未知品種' }}</p>
                <div class="plant-avatar-container">
                    {% if plant and plant.photo_path %}
                    <img src="{{ plant.photo_path }}" alt="Plant" class="img-cover">
                    {% else %}
                    <div class="avatar-placeholder">🌿</div>
                    {% endif %}
                </div>
            </div>
        </div>

        <!-- 數據與控制 -->
        <div class="sensor-cards-container">
            <div class="flex-between">
                <h4 class="mb-0">感測數值</h4>
                <button @click="triggerRefresh()" class="outline secondary btn-ghost" aria-label="更新感測器資料">
                    <svg :class="isRefreshing ? 'rotating' : ''" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M21 2v6h-6" />
                        <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
                        <path d="M3 22v-6h6" />
                        <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
                    </svg>
                </button>
            </div>

            <div id="sensor-container" hx-get="/plants/sensors" hx-trigger="load, every {{ interval }}s"
                hx-swap="innerHTML">
                <div aria-busy="true" class="center-padding-lg">載入中...</div>
            </div>

            <!-- OOB 目標：連線狀態與更新時間定位於此 (維持於感測器下方) -->
            <div id="dashboard-controls"></div>
        </div>
    </div>

    <!-- 換行：左邊 AI 分析，右邊澆水按鈕 (等高) -->
    <div class="dashboard-layout mt-2" style="align-items: stretch;">
        <!-- 左側：AI 分析 -->
        <div id="log-container" style="width: 100%; max-width: 450px; display: flex; flex-direction: column;" hx-get="/plants/logs/latest" hx-trigger="load, every 30s" hx-swap="innerHTML">
            <div aria-busy="true" class="center-padding-lg" style="margin: auto;">🧠 正在讀取 AI 分析...</div>
        </div>

        <!-- 右側：澆水按鈕 -->
        <div style="width: 100%; max-width: 450px; display: flex; flex-direction: column; justify-content: center;">
            <div x-data="{ validating: false }"
                @start-watering-client.window="watering = true; validating = false; wateringRequestTime = $event.detail && $event.detail.cmdTime ? $event.detail.cmdTime : (Date.now() / 1000); const m = document.getElementById('water-warning-dialog'); if(m) m.remove();"
                @show-toast.window="window.showToast($event.detail.message, $event.detail.type);"
                style="display: flex;">
                <button hx-post="/plants/water" hx-target="#water-modal-container" hx-swap="innerHTML"
                    @click="validating = true" @htmx:after-request="validating = false"
                    class="{% if plant and plant.auto_water %}secondary{% else %}contrast{% endif %} btn-large-primary" 
                    :disabled="!isConnected || watering || validating"
                    style="margin: 0; width: 100%; padding: 0.8rem 1rem;">
                    <span x-show="!validating">
                        {% if plant and plant.auto_water %}
                        🔒 手動給水 (自動澆水中)
                        {% else %}
                        💦 啟動系統澆水
                        {% endif %}
                    </span>
                    <span x-show="validating" style="display: none;">⏳ 傳輸中...</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 換行：左邊圖表，右邊照片 -->
    <div id="chart-photo-target">
        <!-- 這個區塊會透過 log_fragment.html 的 OOB 替換 -->
    </div>
</section>
{% endblock %}
