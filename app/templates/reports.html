{% extends "base.html" %}

{% block content %}
<section id="reports" class="fade-in">
    <div class="flex-between mb-2">
        <h2 class="mb-0">📊 歷史健康報表</h2>
        
        <!-- 手動觸發排程按鈕 -->
        <button class="outline btn-icon-text" 
                hx-post="/plants/reports/trigger" 
                hx-target="#report-content" 
                hx-swap="innerHTML"
                onclick="this.setAttribute('aria-busy', 'true')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
            手動健檢與發信
        </button>
    </div>

    <div class="dashboard-card">
        <label for="log_select" class="text-bold mb-sm d-block">回顧過去的紀錄：</label>
        <select id="log_select" 
                name="log_id" 
                hx-get=""
                hx-target="#report-content"
                hx-swap="innerHTML"
                onchange="this.setAttribute('hx-get', '/plants/reports/log/' + this.value); htmx.process(this); htmx.trigger(this, 'change');"
                class="max-w-400">
            {% if logs %}
                {% for log in logs %}
                    <option value="{{ log.id }}">
                        🕒 {{ log.created_at | format_localtime('%Y-%m-%d %H:%M') }}
                    </option>
                {% endfor %}
            {% else %}
                <option value="" disabled selected>尚無排程紀錄</option>
            {% endif %}
        </select>
    </div>
    
    <!-- 歷史報表動態內容載入區 -->
    <div id="report-content">
        {% if selected_log %}
            {% with log=selected_log %}
                {% include "log_fragment.html" %}
            {% endwith %}
        {% else %}
            <div class="empty-state-card">
                目前還沒有任何排程紀錄，您可以點擊右上角的按鈕來執行第一次健檢！
            </div>
        {% endif %}
    </div>

    <!-- OOB 目標：log_fragment.html 的圖表與照片會替換至此 -->
    <div id="chart-photo-target">
    </div>

</section>
{% endblock %}
