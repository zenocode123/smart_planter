{% extends "base.html" %}

{% block content %}
<section id="reports" class="fade-in">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h2 style="margin: 0;">📊 歷史健康報表</h2>
        
        <!-- 手動觸發排程按鈕 -->
        <button class="outline" 
                hx-post="/plants/reports/trigger" 
                hx-target="#report-content" 
                hx-swap="innerHTML"
                style="margin: 0; display: flex; align-items: center; gap: 0.5rem;"
                onclick="this.setAttribute('aria-busy', 'true')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
            手動健檢與發信
        </button>
    </div>

    <div class="card" style="padding: 1.5rem; margin-bottom: 2rem;">
        <label for="log_select" style="font-weight: bold; margin-bottom: 0.5rem; display: block;">回顧過去的紀錄：</label>
        <select id="log_select" 
                name="log_id" 
                hx-get=""
                hx-target="#report-content"
                hx-swap="innerHTML"
                onchange="this.setAttribute('hx-get', '/plants/reports/log/' + this.value); htmx.process(this); htmx.trigger(this, 'change');"
                style="width: 100%; max-width: 400px;">
            {% if logs %}
                {% for log in logs %}
                    <option value="{{ log.id }}">
                        🕒 {{ log.created_at.strftime('%Y-%m-%d %H:%M') }}
                    </option>
                {% endfor %}
            {% else %}
                <option value="" disabled selected>尚無排程紀錄</option>
            {% endif %}
        </select>
    </div>
    
    <!-- 歷史報表動態內容載入區 -->
    <div id="report-content">
        {% if selected_log %}
            {% with log=selected_log %}
                {% include "log_fragment.html" %}
            {% endwith %}
        {% else %}
            <div style="text-align: center; color: var(--pico-muted-color); padding: 2rem; border: 1px dashed var(--pico-muted-border-color); border-radius: 8px;">
                目前還沒有任何排程紀錄，您可以點擊右上角的按鈕來執行第一次健檢！
            </div>
        {% endif %}
    </div>

</section>
{% endblock %}
