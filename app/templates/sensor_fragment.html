<div id="sensor-data-wrapper">
    <!-- 狀態同步：確保 Alpine.js 全域狀態與伺服器數據一致 -->
    <div x-init="checkConnection('{{ data.status }}')" x-effect="watering = {{ 'true' if data.watering else 'false' }}"></div>

    <div class="sensor-cards-container">
        <div class="sensor-card">
            <span>🌡️ 溫度</span>
            <span class="sensor-value">{{ data.temp if data.temp is not none else '--' }} <small>°C</small></span>
        </div>
        <div class="sensor-card">
            <span>💧 濕度</span>
            <span class="sensor-value">{{ data.hum if data.hum is not none else '--' }} <small>%</small></span>
        </div>
        <div class="sensor-card">
            <span>🌱 土壤濕度</span>
            <span class="sensor-value" :style="'color: {{ 'var(--pico-secondary)' if data.moisture and data.moisture < 30 else 'inherit' }}'">
                {{ data.moisture if data.moisture is not none else '--' }} <small>%</small>
            </span>
        </div>
        <div class="sensor-card">
            <span>☀️ 光照</span>
            <span class="sensor-value">{{ data.lux if data.lux is not none else '--' }} <small>lx</small></span>
        </div>
    </div>

    <!-- 狀態資訊 (Footer OOB) -->
    <div id="dashboard-controls" hx-swap-oob="true">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; opacity: 0.8;">
            <small>最後更新：{{ update_time }}</small>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <small :style="'color: ' + (isConnected ? '#3b82f6' : '#ef4444')" 
                       x-text="isConnected ? 'ESP32連線中' : 'ESP32已斷線'"></small>
            </div>
        </div>
    </div>
</div>
