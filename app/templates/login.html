{% extends "base.html" %}

{% block content %}
<article style="max-width: 400px; margin: 2rem auto;">
    <h2 style="text-align: center;">系統登入</h2>

    {% if msg %}
    <dialog open id="flash-msg" x-init="setTimeout(() => { $el.remove() }, 2000)">
        <article style="text-align: center; border: 2px solid {{ 'var(--pico-ins-color)' if '請先登入' not in msg else '#eab308' }};">
            <h3 style="color: {{ 'var(--pico-ins-color)' if '請先登入' not in msg else '#eab308' }}; margin: 0;">
                {{ '✅' if '請先登入' not in msg else '⚠️' }} {{ msg }}
            </h3>
        </article>
    </dialog>
    {% endif %}

    <form hx-post="/auth/login" hx-target="#auth-message" hx-swap="innerHTML">
        <label for="username">
            Gmail 帳號
            <input type="text" id="username" name="username" required placeholder="example@gmail.com">
        </label>

        <label for="password">
            密碼
            <input type="password" id="password" name="password" required placeholder="輸入密碼">
        </label>

        <div id="auth-message" style="margin-bottom: 1rem;"></div>

        <fieldset style="margin-bottom: 1rem;">
            <label for="remember_me">
                <input type="checkbox" id="remember_me" name="remember_me" value="true">
                記住我
            </label>
        </fieldset>

        <button type="submit">登入系統</button>
    </form>

    <p style="text-align: center; margin-top: 1rem;">還沒有帳號嗎？<a href="/auth/register">立即註冊</a></p>
</article>
{% endblock %}
