{% extends "base.html" %}

{% block content %}
<article class="login-card">
    <h2 class="text-center">系統登入</h2>

    {% if msg %}
    <div x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 3000)" x-transition
        class="toast-notice-container">
        <article class="toast-notice-card solid-popup-bg {{ '' if '請先登入' not in msg else 'border-warning' }}">
            <span class="{% if '請先登入' not in msg %}toast-notice-text{% else %}text-warning{% endif %}" style="font-weight: bold;">
                {{ '✅' if '請先登入' not in msg else '⚠️' }} {{ msg }}
            </span>
        </article>
    </div>
    {% endif %}

    <form hx-post="/auth/login" hx-target="#auth-message" hx-swap="innerHTML">
        <label for="username">
            Gmail 帳號
            <input type="text" id="username" name="username" required placeholder="example@gmail.com">
        </label>

        <label for="password">
            密碼
            <input type="password" id="password" name="password" required placeholder="輸入密碼">
        </label>

        <div id="auth-message" class="mb-1"></div>

        <fieldset class="mb-1">
            <label for="remember_me" class="checkbox-align-row">
                <input type="checkbox" id="remember_me" name="remember_me" value="true" checked>
                <span class="checkbox-align-text">記住我</span>
            </label>
        </fieldset>

        <button type="submit">登入系統</button>
    </form>

    <p class="text-center mt-1">還沒有帳號嗎？<a href="/auth/register">立即註冊</a></p>
</article>
{% endblock %}
